import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    id 'com.google.devtools.ksp'  version '2.0.0-1.0.24'
}

allprojects {
    apply plugin: 'base'
    apply plugin: 'java'
    apply plugin: 'java-test-fixtures'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'com.google.devtools.ksp'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    compileKotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            languageVersion = KotlinVersion.KOTLIN_1_9
            freeCompilerArgs = ["-Xjvm-default=all"]
        }
    }
    compileTestKotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            languageVersion = KotlinVersion.KOTLIN_1_9
            freeCompilerArgs = ["-Xjvm-default=all"]
        }
    }

    dependencies {
        compileOnly 'com.github.spotbugs:spotbugs-annotations:4.7.3'
        testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.7.3'
    }

    tasks.withType(Tar).configureEach { duplicatesStrategy DuplicatesStrategy.INCLUDE }
    tasks.withType(Zip).configureEach { duplicatesStrategy DuplicatesStrategy.INCLUDE }
}
